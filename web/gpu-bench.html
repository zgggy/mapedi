<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mapedi 地块渲染性能对照</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 24px; font: 14px/1.6 -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f6f7f9; color: #1c2733; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lead { color: #55606c; max-width: 720px; margin: 0 0 18px; }
  .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; background: #fff; padding: 14px 16px; border: 1px solid #e2e6ea; border-radius: 10px; margin-bottom: 18px; }
  .controls label { color: #55606c; }
  input[type=range] { width: 220px; }
  button { padding: 7px 16px; border: 1px solid #2a6bd4; background: #2a6bd4; color: #fff; border-radius: 8px; cursor: pointer; font: inherit; }
  button:hover { background: #1f5bb8; }
  #buildInfo { color: #55606c; width: 100%; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .pane { background: #fff; border: 1px solid #e2e6ea; border-radius: 10px; padding: 14px; }
  .pane h2 { font-size: 15px; margin: 0 0 10px; font-variant-numeric: tabular-nums; }
  .pane canvas { width: 100%; border: 1px solid #d6dbe0; border-radius: 6px; background: #fbfcfd; }
  .pane p { color: #55606c; margin: 10px 0 0; font-size: 12px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; margin-right: 8px; }
  .cur { background: #fdecea; color: #c0392b; }
  .opt { background: #e8f0fe; color: #2a6bd4; }
</style>
</head>
<body>
  <h1>mapedi 地块渲染：Canvas2D vs GPU</h1>
  <p class="lead">同一份真实球面 Voronoi 胞腔、同样幅度的水平拖动。左＝现状（Canvas2D 逐 path 填充），右＝优化（three.js GPU 批量，一次 draw call）。看两边的 fps 与每帧绘制耗时，即可判断 web 端 GPU 化能否解决卡顿。</p>
  <div class="controls">
    <label>地块数</label>
    <input type="range" id="cells" min="1000" max="100000" step="1000" value="20000" />
    <span id="cellsLabel">20000</span>
    <button id="rebuild">重建数据</button>
    <div id="buildInfo">正在生成胞腔…</div>
  </div>
  <div class="panes">
    <div class="pane">
      <h2><span class="tag cur">现状</span><span id="c2dStat">—</span></h2>
      <canvas id="c2d"></canvas>
      <p>逐个 <code>beginPath / fill</code>，地块越多 CPU 越吃力——这就是卡顿来源。</p>
    </div>
    <div class="pane">
      <h2><span class="tag opt">优化</span><span id="gpuStat">—</span></h2>
      <canvas id="gpu"></canvas>
      <p>所有胞腔三角化后合并进一个 buffer，每帧只改相机偏移、单次 draw call 交 GPU。</p>
    </div>
  </div>
  <script type="module" src="/src/gpu-bench/main.ts"></script>
</body>
</html>
